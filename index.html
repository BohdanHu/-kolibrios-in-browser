    <!-- v86 x86-to-WebAssembly emulator (relative path for GitHub Pages compatibility) -->
    <script src="./libv86.js"></script>
    <script>
      // Ensure both V86 and V86Starter constructor aliases are defined
      if (typeof window !== "undefined") {
        if (window.V86 && !window.V86Starter) {
          window.V86Starter = window.V86;
        } else if (window.V86Starter && !window.V86) {
          window.V86 = window.V86Starter;
        }
      }
    </script>

  <body class="bg-zinc-950 text-zinc-100 min-h-screen antialiased select-none">
